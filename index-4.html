<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Valentine 💖</title>
<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: 'Segoe UI', Arial, sans-serif;
  background: linear-gradient(135deg, #1d2671, #c33764);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  position: relative;
  z-index: 2;
  background: rgba(255,255,255,0.92);
  padding: 45px;
  border-radius: 32px;
  box-shadow: 0 25px 60px rgba(0,0,0,0.4);
  text-align: center;
  backdrop-filter: blur(8px);
}

h1 {
  font-size: 32px;
  margin-bottom: 30px;
}

button {
  font-size: 22px;
  padding: 15px 42px;
  border-radius: 18px;
  border: none;
  cursor: pointer;
  margin: 15px;
  transition: all 0.4s ease;
}

#yes {
  background: linear-gradient(135deg, #ff416c, #ff4b2b);
  color: white;
}

#no {
  background: #e0e0e0;
}

.hidden {
  opacity: 0;
  pointer-events: none;
}

.heart {
  position: fixed;
  top: -10px;
  font-size: 24px;
  animation: fall linear forwards;
  z-index: 1;
}

@keyframes fall {
  to {
    transform: translateY(110vh);
    opacity: 0;
  }
}
</style>
</head>
<body>

<div class="container">
  <h1>Guodute 🥺❤<br>will you be my Valentine?</h1>
  <button id="yes">YES 💘</button>
  <button id="no">NO ❌</button>
</div>

<audio id="romantic" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-10.mp3" loop></audio>
<audio id="noSound" src="https://www.soundjay.com/button/sounds/button-10.mp3"></audio>
<audio id="waitSong" src="https://www.soundjay.com/voice/sounds/just-do-it-1.mp3"></audio>

<script>
const yesBtn = document.getElementById("yes");
const noBtn = document.getElementById("no");
const romantic = document.getElementById("romantic");
const noSound = document.getElementById("noSound");
const waitSong = document.getElementById("waitSong");

let interacted = false;

// jei nieko nespaudžia – paleidžia dainą 😈
setTimeout(() => {
  if (!interacted) {
    waitSong.volume = 0.9;
    waitSong.play();
  }
}, 4000);

// YES
yesBtn.addEventListener("click", () => {
  interacted = true;
  waitSong.pause();
  romantic.volume = 0.45;
  romantic.play();

  document.body.innerHTML = `
    <div style="
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Segoe UI', Arial;
    ">
      <div>
        <h1 style="font-size:40px;">Tuo ir tikėjausi 😂🤭❤</h1>
        <p style="font-size:26px; margin-top:20px;">
          💌 <strong>Myliu tave labai<br>mano Gyvenimo Spindulėli</strong> 💌
        </p>
      </div>
    </div>
  `;
});

// NO
noBtn.addEventListener("click", () => {
  interacted = true;
  waitSong.pause();
  noSound.play();
  noBtn.classList.add("hidden");
});

// širdelės
function createHeart() {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "❤";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration = (2 + Math.random() * 3) + "s";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 5000);
}
setInterval(createHeart, 350);
</script>

</body>
</html>
